spring.application.name=gallery
server.port=${PORT:8080}

# Database Configuration
# Uses H2 in-memory DB by default (for cloud deployment)
# Override with MySQL env vars for local development
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:artium;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=artiumvirtualgallery@gmail.com
spring.mail.password=${MAIL_PASSWORD:ypng cbcr rphy waos}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

# Set to false to disable emails (useful if SMTP is blocked in cloud env)
mail.enabled=${MAIL_ENABLED:true}

# Gallery name for emails
app.gallery.name=Artium Gallery
