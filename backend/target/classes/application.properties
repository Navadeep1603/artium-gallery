spring.application.name=gallery
server.port=${PORT:8080}

# ── Database Configuration ─────────────────────────────────────────
# Default: H2 in-memory (for Render cloud deployment - no external DB needed)
# To use MySQL locally, set DATABASE_URL env var
spring.datasource.url=jdbc:h2:mem:artiumdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console (for debugging at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Email Configuration (Google Apps Script Proxy) ──────────────────
mail.enabled=${MAIL_ENABLED:true}
mail.script.url=${MAIL_SCRIPT_URL:https://script.google.com/macros/s/AKfycbwrW4JuOevocODC-OOFS7nY-jABJk9Lbvd1WHS1HXqPZW7Y-URan_Efdt6G0XRZ_XGacg/exec}

# ── Gallery Info ──────────────────────────────────────────────────
app.gallery.name=Artium Gallery
