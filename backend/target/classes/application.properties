spring.application.name=gallery
server.port=${PORT:8080}

# ── Database Configuration ─────────────────────────────────────────
# Uses Cloud MySQL if provided via Render Env Vars; defaults to local H2
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:artiumdb}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console (for debugging at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Email Configuration (Google Apps Script Proxy) ──────────────────
mail.enabled=${MAIL_ENABLED:true}
mail.script.url=${MAIL_SCRIPT_URL:https://script.google.com/macros/s/AKfycbwrW4JuOevocODC-OOFS7nY-jABJk9Lbvd1WHS1HXqPZW7Y-URan_Efdt6G0XRZ_XGacg/exec}
admin.email=${ADMIN_EMAIL:2400030987@kluniversity.in}

# ── Gallery Info ──────────────────────────────────────────────────
app.gallery.name=Artium Gallery
