spring.application.name=gallery
server.port=${PORT:8080}

# ── Database Configuration ─────────────────────────────────────────
# Default: H2 in-memory (for Render cloud deployment - no external DB needed)
# To use MySQL locally, set DATABASE_URL env var
spring.datasource.url=jdbc:h2:mem:artiumdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console (for debugging at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Email Configuration (Gmail SMTP) ──────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=artiumvirtualgallery@gmail.com
spring.mail.password=${MAIL_PASSWORD:ypng cbcr rphy waos}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

# Set to false to skip sending emails (e.g. if SMTP is blocked)
mail.enabled=${MAIL_ENABLED:true}

# ── Gallery Info ──────────────────────────────────────────────────
app.gallery.name=Artium Gallery
